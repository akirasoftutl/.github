name: Sincronizar etiquetas

# Crea o actualiza las etiquetas de labels.json en todos los repos de la organización
# y elimina las que aparecen en labels-obsoletas.txt.
# Requiere el secreto AKIRASOFTUTL (token classic con scopes "repo", "project" y "read:org").

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo específico (vacío = todos los repos de la organización)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: [labels.json, labels-obsoletas.txt]
  schedule:
    - cron: "0 6 * * 1" # cada lunes, para cubrir repos nuevos

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar etiquetas
        env:
          GH_TOKEN: ${{ secrets.AKIRASOFTUTL }}
          ORG: ${{ github.repository_owner }}
          TARGET_REPO: ${{ inputs.repo }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta el secreto AKIRASOFTUTL (ver SCRUM.md, sección Configuración)."
            exit 1
          fi

          if [ -n "$TARGET_REPO" ]; then
            repos="$TARGET_REPO"
          else
            repos=$(gh repo list "$ORG" --limit 500 --no-archived --json name --jq '.[].name')
          fi

          for repo in $repos; do
            echo "::group::$ORG/$repo"
            existentes=$(gh label list --repo "$ORG/$repo" --limit 500 --json name --jq '.[].name')

            grep -v '^\s*#' labels-obsoletas.txt | grep -v '^\s*$' | while IFS= read -r name; do
              if grep -qxF "$name" <<< "$existentes"; then
                echo "Eliminando '$name'"
                gh label delete "$name" --repo "$ORG/$repo" --yes \
                  || echo "::warning::No se pudo eliminar '$name' en $repo"
              fi
            done

            jq -c '.[]' labels.json | while read -r label; do
              name=$(jq -r '.name' <<< "$label")
              color=$(jq -r '.color' <<< "$label")
              desc=$(jq -r '.description' <<< "$label")
              gh label create "$name" --repo "$ORG/$repo" --color "$color" --description "$desc" --force \
                || echo "::warning::No se pudo crear '$name' en $repo"
            done
            echo "::endgroup::"
          done
