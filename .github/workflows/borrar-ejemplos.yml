name: Borrar issues de ejemplo

# Borra definitivamente las issues de ejemplo (solo las que tienen "(EJEMPLO)" en el título).
# Temporal: se elimina después de usarse.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repositorio"
        required: true
        default: "AkiraSoft_BE"

permissions:
  contents: read

jobs:
  borrar:
    runs-on: ubuntu-latest
    steps:
      - name: Borrar issues con "(EJEMPLO)" en el título
        env:
          GH_TOKEN: ${{ secrets.AKIRASOFTUTL }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repo }}
        run: |
          numeros=$(gh issue list --repo "$REPO" --state all --limit 1000 --json number,title \
            --jq '.[] | select(.title | contains("(EJEMPLO)")) | .number')
          if [ -z "$numeros" ]; then
            echo "No hay issues de ejemplo en $REPO."
            exit 0
          fi
          for n in $numeros; do
            echo "Borrando $REPO#$n"
            gh issue delete "$n" --repo "$REPO" --yes
          done
