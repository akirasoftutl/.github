name: 🏔️ Épica
description: Funcionalidad grande que se divide en varias Historias de Usuario.
title: "[ÉPICA] "
labels: ["tipo: épica", "estado: backlog"]
body:
  - type: markdown
    attributes:
      value: |
        Una **Épica** agrupa varias Historias de Usuario relacionadas. La crea y prioriza el **Product Owner**.
        Después de crearla, agrega las historias como *sub-issues*.
  - type: textarea
    id: objetivo
    attributes:
      label: 🎯 Objetivo
      description: ¿Qué valor de negocio aporta esta épica?
      placeholder: Permitir que los usuarios gestionen su cuenta de forma autónoma.
    validations:
      required: true
  - type: textarea
    id: alcance
    attributes:
      label: 📦 Alcance
      description: Qué incluye y qué NO incluye.
      placeholder: |
        **Incluye:**
        - Registro
        - Inicio de sesión

        **No incluye:**
        - Inicio de sesión con redes sociales
    validations:
      required: true
  - type: textarea
    id: historias
    attributes:
      label: 📝 Historias de Usuario previstas
      description: Lista inicial (se irá refinando). Luego vincúlalas como sub-issues.
      placeholder: |
        - [ ] Como usuario quiero registrarme...
        - [ ] Como usuario quiero iniciar sesión...
  - type: textarea
    id: metricas
    attributes:
      label: 📈 Criterio de éxito
      description: ¿Cómo sabremos que la épica está terminada?
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - "🔴 Alta"
        - "🟠 Media"
        - "🟢 Baja"
    validations:
      required: true
