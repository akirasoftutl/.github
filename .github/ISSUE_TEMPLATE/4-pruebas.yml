name: Pruebas (QA)
description: Probar una historia de punta a punta antes de darla por terminada. Vive en el repo de la app.
title: "[QA] "
labels: ["tipo: qa"]
body:
  - type: markdown
    attributes:
      value: |
        Crea esta issue en el repo de la app donde el usuario hace la acción y agrégala como sub-issue de la misma épica que las issues de la historia.
        Se prueba sobre `dev` cuando las issues de la historia ya están fusionadas. Si una prueba falla, abre un **Reporte de error** en el repo donde está la falla y enlázalo aquí.
  - type: input
    id: issue
    attributes:
      label: Qué se prueba
      description: Número de la historia o tarea.
      placeholder: "#12"
    validations:
      required: true
  - type: textarea
    id: casos
    attributes:
      label: Casos de prueba
      description: Normalmente, uno por cada criterio de aceptación. Marca cada caso al comprobarlo.
      placeholder: |
        - [ ] Registro con datos válidos crea la cuenta.
        - [ ] Registro con un correo existente muestra error.
        - [ ] La contraseña no se guarda en texto plano.
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Dónde se prueba
      description: Opcional. Rama, ambiente o URL.
      placeholder: "rama feature/registro, ambiente local"
  - type: textarea
    id: resultado
    attributes:
      label: Resultado
      description: Se llena al terminar. Indica qué pasó y enlaza los reportes de error que se hayan abierto.
