name: Tarea
description: Trabajo técnico concreto. Normalmente forma parte de una historia de usuario.
title: "[Tarea] "
labels: ["tipo: tarea"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué hay que hacer.
    validations:
      required: true
  - type: input
    id: historia
    attributes:
      label: Historia relacionada
      description: Opcional. Número de la historia a la que pertenece, por ejemplo #12.
      placeholder: "#12"
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Backend
        - Frontend
        - Base de datos
        - Diseño UI/UX
        - QA
        - DevOps
        - Documentación
    validations:
      required: true
  - type: textarea
    id: terminado
    attributes:
      label: Se considera terminada cuando
      description: Opcional. Lista de pasos o condiciones.
      placeholder: |
        - [ ]
        - [ ]
