name: Reporte de error
description: Algo no funciona como debería.
title: "[Bug] "
labels: ["tipo: bug"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qué pasa
      description: Describe el error en una o dos frases.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a ...
        2. Hacer clic en ...
        3. Aparece el error ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Crítica - el sistema no se puede usar
        - Alta - una función principal no sirve
        - Media - hay una forma de evitarlo
        - Baja - detalle menor o visual
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Opcional. Capturas de pantalla, logs o el entorno donde ocurre (navegador, rama, etc.).
