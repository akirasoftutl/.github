name: 🔬 Spike / Investigación
description: Investigación con tiempo limitado para reducir incertidumbre técnica.
title: "[SPIKE] "
labels: ["tipo: spike", "estado: backlog"]
body:
  - type: textarea
    id: pregunta
    attributes:
      label: ❓ Pregunta a resolver
      placeholder: ¿Qué librería usamos para autenticación con JWT?
    validations:
      required: true
  - type: dropdown
    id: timebox
    attributes:
      label: ⏳ Timebox
      options:
        - "2h"
        - "4h"
        - "1 día"
        - "2 días"
    validations:
      required: true
  - type: textarea
    id: resultado
    attributes:
      label: 📄 Resultado esperado
      description: ¿Qué entregable tendrá? (documento, prototipo, recomendación...)
    validations:
      required: true
