name: 🐞 Bug
description: Reportar un error o comportamiento inesperado.
title: "[BUG] "
labels: ["tipo: bug", "estado: backlog"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: 🐞 ¿Qué pasó?
      description: Descripción clara del error.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: 🔁 Pasos para reproducir
      value: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Ver el error
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ✅ Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: 📸 Capturas / Logs
      description: Arrastra imágenes o pega los logs.
      render: shell
  - type: input
    id: entorno
    attributes:
      label: 💻 Entorno
      placeholder: "Chrome 128, Windows 11, rama develop"
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - "🔴 Crítica (bloquea el sistema)"
        - "🟠 Alta (funcionalidad principal afectada)"
        - "🟡 Media (hay alternativa)"
        - "🟢 Baja (detalle visual / menor)"
    validations:
      required: true
