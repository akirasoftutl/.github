name: 🛠️ Tarea
description: Trabajo técnico concreto (normalmente parte de una Historia de Usuario).
title: "[TAREA] "
labels: ["tipo: tarea", "estado: por hacer"]
body:
  - type: input
    id: historia
    attributes:
      label: 📖 Historia de Usuario relacionada
      description: Número de la historia (ej. #34).
      placeholder: "#34"
  - type: textarea
    id: descripcion
    attributes:
      label: 📝 Descripción
      description: ¿Qué hay que hacer exactamente?
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: ☑️ Checklist
      value: |
        - [ ]
        - [ ]
  - type: dropdown
    id: area
    attributes:
      label: 👥 Área / Rol responsable
      options:
        - "Frontend"
        - "Backend"
        - "Base de datos"
        - "UI/UX Diseño"
        - "QA / Testing"
        - "DevOps"
        - "Documentación"
    validations:
      required: true
  - type: dropdown
    id: estimacion
    attributes:
      label: ⏱️ Estimación (horas)
      options:
        - "1h"
        - "2h"
        - "4h"
        - "8h (1 día)"
        - "+8h (dividir la tarea)"
